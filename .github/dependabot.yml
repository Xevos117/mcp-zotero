# Keeps the GitHub Actions used by the workflows current (version tags and the SHA-pinned ones).
# npm dependencies are handled by the monthly deps-update agent, not here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
