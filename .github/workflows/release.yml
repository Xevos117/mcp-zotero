name: Release — npm publish & skill zips

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0). Creates the release if it doesn't exist."
        required: true

permissions:
  contents: read

jobs:
  # ── 1. Run tests before publishing anything ──────────────────
  # Tests the release tag when it exists. Started by hand with a tag that does not exist yet, it tests the
  # dispatch ref: skill-zips then creates the tag from the default branch.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Check out the release tag if it exists
        timeout-minutes: 2
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if timeout 60 git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            git checkout --detach "refs/tags/$TAG"
            echo "testing tag $TAG"
          else
            echo "::notice::tag $TAG does not exist yet: testing $GITHUB_REF (skill-zips creates the tag)"
          fi
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      - run: npm test
        timeout-minutes: 5
      - run: npm run smoke
        timeout-minutes: 2
      - name: E2E tests (built server over stdio, fake Zotero API)
        run: npx vitest run --config vitest.e2e.config.ts
        timeout-minutes: 5

  # ── 2. Publish to npm ───────────────────────────────────────
  # Ready for npm Trusted Publishing (OIDC + provenance). Until the owner configures the trusted
  # publisher for this repository/workflow/environment on npmjs.com, NODE_AUTH_TOKEN (NPM_TOKEN) is the
  # fallback; once trusted publishing works, delete the NPM_TOKEN secret and the env line below.
  # Tests run only in the `test` job: publish uses --ignore-scripts, so prepublishOnly never runs
  # with publishing credentials in the environment.
  # On workflow_dispatch the default checkout is the branch, not the release: check out the tag and refuse to
  # publish unless package.json has its version (same check as mcp-registry and mcpb-build).
  npm-publish:
    needs: [test, skill-zips] # skill-zips creates the release (and its tag) when started by hand with a new tag
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Check package.json version = release tag
        timeout-minutes: 1
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::package.json version $VERSION does not match the release tag $TAG"
            exit 1
          fi

      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; exact version, bumped deliberately (Dependabot does not track it)
      - run: npm install -g npm@11.21.0 --ignore-scripts
        timeout-minutes: 3
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      - run: npm publish --access public --provenance --ignore-scripts
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback until Trusted Publishing is configured

  # ── 3. Publish server.json to the MCP Registry ──────────────
  # registry.modelcontextprotocol.io keeps metadata only and checks that the npm package version named in
  # server.json carries the same mcpName, so this runs after the npm publish. GitHub OIDC login grants the
  # io.github.<repository owner>/* namespace: no secret, and id-token only on this job.
  # Also after skill-zips: on workflow_dispatch with a new tag, that job creates the release and its tag, which the
  # checkout below needs.
  mcp-registry:
    needs: [npm-publish, skill-zips]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # The checkout must be the released version (on workflow_dispatch the default ref is the branch, not the tag)
      - name: Check package.json version = release tag
        timeout-minutes: 1
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::package.json version $VERSION does not match the release tag $TAG"
            exit 1
          fi

      # Exact release and checksum (registry_<version>_checksums.txt of that release), bumped deliberately.
      # server.json is checked against package.json (version, mcpName) by npm test in the test job.
      - name: Install mcp-publisher
        timeout-minutes: 3
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc # linux_amd64
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      - run: ./mcp-publisher validate server.json
        timeout-minutes: 2

      - run: ./mcp-publisher login github-oidc
        timeout-minutes: 2

      # The registry reads the version from npm: a just-published version can take a moment to appear there
      - name: Publish to the MCP Registry
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if timeout 60 ./mcp-publisher publish server.json; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

  # ── 4. Generate skill zips and attach to the release ────────
  # Creates the release (and its tag) when started by hand with a new tag, so npm-publish, mcp-registry and mcpb-build
  # wait for it; the zips are built from the tag's content.
  skill-zips:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release and upload its assets
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: Resolve or create release
        id: tag
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, never interpolated into the script (workflow_dispatch input).
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Create the release if it doesn't exist yet: only for the version in package.json, and on the commit this
          # run tested (a manual run from another branch must not tag the default branch)
          if ! timeout 60 gh release view "$TAG" > /dev/null 2>&1; then
            VERSION=$(node -p 'require("./package.json").version')
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::package.json version $VERSION does not match the release tag $TAG: no release created"
              exit 1
            fi
            timeout 60 gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      # The zips must hold the released version (on workflow_dispatch the default checkout is the branch)
      - name: Check out the release tag
        timeout-minutes: 2
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          timeout 60 git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "refs/tags/$TAG"
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::package.json version $VERSION does not match the release tag $TAG"
            exit 1
          fi

      - name: Create skill zip archives
        timeout-minutes: 3
        run: |
          mkdir -p dist-skills
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            (cd skills && zip -r "../dist-skills/${skill_name}.zip" "$skill_name")
          done
          ls -lh dist-skills/

      - name: Upload zips to GitHub Release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          for zip_file in dist-skills/*.zip; do
            gh release upload "$TAG" "$zip_file" --clobber
          done

  # ── 5. Build the Claude Desktop extension (.mcpb) ───────────
  # Read-only job: the bundle is built (npm run bundle: clean build, production dependencies installed without
  # scripts, packed with the pinned @anthropic-ai/mcpb) and smoke-tested unpacked, then handed over as an artifact.
  mcpb-build:
    needs: [test, skill-zips] # skill-zips creates the release (and its tag) when started by hand with a new tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      # The checkout must be the released version (on workflow_dispatch the default ref is the branch, not the tag)
      - name: Check package.json version = release tag
        timeout-minutes: 1
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::package.json version $VERSION does not match the release tag $TAG"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npx mcpb validate manifest.json
        timeout-minutes: 1
      - name: Build and smoke-test the bundle
        timeout-minutes: 8
        run: |
          npm run bundle
          npm run smoke -- --bundle dist/mcp-zotero.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 3
        with:
          name: mcpb
          path: dist/mcp-zotero.mcpb
          if-no-files-found: error
          retention-days: 7

  # ── 6. Attach the .mcpb to the release ──────────────────────
  # The only write job for the bundle: no checkout, no npm.
  mcpb-upload:
    needs: [mcpb-build, skill-zips]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        with:
          name: mcpb
      - name: Upload the .mcpb to the GitHub Release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Passed through env, never interpolated into the script (workflow_dispatch input).
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" mcp-zotero.mcpb --clobber
