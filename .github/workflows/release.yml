name: Release — npm publish & skill zips

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0). Creates the release if it doesn't exist."
        required: true

permissions:
  contents: write   # needed to upload release assets

jobs:
  # ── 1. Run tests before publishing anything ──────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      - run: npm test
        timeout-minutes: 5
      - run: npm run smoke
        timeout-minutes: 2
      - name: E2E tests (built server over stdio, fake Zotero API)
        run: npx vitest run --config vitest.e2e.config.ts
        timeout-minutes: 5

  # ── 2. Publish to npm ───────────────────────────────────────
  npm-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      - run: npm publish --access public
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 3. Generate skill zips and attach to the release ────────
  skill-zips:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create skill zip archives
        timeout-minutes: 3
        run: |
          mkdir -p dist-skills
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            (cd skills && zip -r "../dist-skills/${skill_name}.zip" "$skill_name")
          done
          ls -lh dist-skills/

      - name: Resolve or create release
        id: tag
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, never interpolated into the script (workflow_dispatch input).
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Create the release if it doesn't exist yet
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload zips to GitHub Release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          for zip_file in dist-skills/*.zip; do
            gh release upload "$TAG" "$zip_file" --clobber
          done
