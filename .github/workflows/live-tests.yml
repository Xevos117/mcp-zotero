name: Live tests

# Live suite (test/live) against the dedicated Zotero test account. Secrets live in the
# `zotero-live` environment: ZOTERO_TEST_API_KEY, ZOTERO_TEST_USER_ID, ZOTERO_TEST_USERNAME,
# ZOTERO_TEST_GROUP_ID (optional), UNPAYWALL_EMAIL.
on:
  # No base-branch filter (stacked PRs). Fork PRs get no secrets: the job is skipped by its `if`.
  pull_request:
  push:
    branches: [main]
  schedule:
    # nightly, to notice changes in Zotero, doi.org, Unpaywall or publishers
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One group per workflow and PR/ref: a new push supersedes the previous run of the same PR. Runs of
# different PRs (and the agent smoke test) are serialized on the Zotero side by test/live/lock.mjs,
# so stacked PRs never cancel each other's required checks; a queued run waits up to 70 min
# (an agent smoke run holds the account for up to about 80 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter at job level (not `on.paths`): a required check that never starts would block
  # docs-only PRs. The required check is the live-tests job below, which decides from these results.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed files
        id: filter
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/|skills/zotero-skill-mcp-integrations/|test/live/|test/helpers/|test/e2e/server-process\.ts|test/fixtures/|package(-lock)?\.json|tsconfig\.json|vitest\.live\.config\.ts|\.github/workflows/live-tests\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  live:
    name: live-tests-run
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 100
    # Secrets only at step level, in the steps that talk to Zotero (never during npm ci or the build).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - name: Require the test account
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
        run: |
          # without the key the suite would be skipped and the check would pass vacuously
          if [ -z "$ZOTERO_TEST_API_KEY" ] || [ -z "$ZOTERO_TEST_USERNAME" ]; then
            echo "::error::zotero-live environment secrets missing (ZOTERO_TEST_API_KEY, ZOTERO_TEST_USERNAME)"
            exit 1
          fi
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      # Up to 70 min waiting for the test-account lock + ~5 min of tests; shorter than the job, so the
      # always() steps below still have time to clean up and release the lock.
      - name: Live suite
        timeout-minutes: 85
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          # more than 2 cases skipped because an external service was down → the run fails
          ZOTERO_LIVE_MAX_SOFT_SKIPS: "2"
          ZOTERO_LIVE_LOCK_WAIT_MIN: "70"
        run: npx vitest run --config vitest.live.config.ts
      - name: Clean up interrupted runs
        if: always()
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: npm run test:live:cleanup
      - name: Scrub report
        if: always()
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: node test/live/scrub-report.mjs live-artifacts .vitest/live-report.json .vitest/live-summary.json
      - name: Upload scrubbed report
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: live-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # The required check. It runs unless the workflow itself was cancelled (a superseded run ends "cancelled",
  # not red) and is never skipped, since a skipped required check counts as passed: a failed `changes` job, or a
  # failed or timed-out (concluded "cancelled") live-tests-run, makes it fail. It passes without the suite only
  # when `changes` succeeded and found nothing relevant, or for fork PRs and Dependabot, which get no secrets.
  verdict:
    name: live-tests # required check name
    needs: [changes, live]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Outcome of the live suite
        timeout-minutes: 1
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LIVE: ${{ needs.live.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes: $CHANGES (the file filter must succeed, or the check would pass without running)"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "::notice::no change relevant to the live suite"
            exit 0
          fi
          case "$LIVE" in
            success) echo "live suite passed" ;;
            skipped) echo "::notice::fork PRs and Dependabot get no secrets: live suite not run" ;;
            *) echo "::error::live-tests-run: $LIVE"; exit 1 ;;
          esac

  # Nightly failures open (or update) one issue; it carries links and test names, never data.
  report-nightly:
    needs: live
    if: always() && github.event_name == 'schedule' && needs.live.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: live-report
          path: live-artifacts
      - name: Open or update the nightly issue
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(node -e '
            const fs = require("fs");
            const p = "live-artifacts/live-report.json";
            if (!fs.existsSync(p)) { console.log("- (report not available)"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const names = r.testResults.flatMap((f) => f.assertionResults.filter((t) => t.status === "failed").map((t) => t.fullName || t.title));
            console.log(names.length ? names.map((n) => "- " + n).join("\n") : "- (failure outside the tests: setup, teardown or cleanup)");
          ')
          body=$(printf 'Run: %s\n\nFailed tests:\n%s\n' "$RUN_URL" "$failed")
          title="Test dal vivo notturni falliti"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
