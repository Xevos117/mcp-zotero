name: Tests

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target the branch below them, not main.
  pull_request:
  # Started on the dependency branch by deps-update.yml (a GITHUB_TOKEN push triggers no other event);
  # the check runs attach to the branch head, i.e. the PR head.
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and PR/ref. On pull requests a newer run cancels the older one (duplicate
# pull_request events for the same head used to run the matrix twice): the cancelled run's checks are
# "cancelled", not failed, and GitHub shows the newest check run of each name for the head commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 22 = minimum supported (engines), 24 = active LTS, 26 = current
        node-version: [22, 24, 26]

    name: test (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3

      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts: the native binaries come as optionalDependencies
      - run: npm ci --ignore-scripts
        timeout-minutes: 5

      - run: npm run build
        timeout-minutes: 3

      - run: npm test
        timeout-minutes: 5

      - name: Smoke test built server over stdio
        run: npm run smoke
        timeout-minutes: 2

      - name: E2E tests (built server over stdio, fake Zotero API)
        run: npx vitest run --config vitest.e2e.config.ts
        timeout-minutes: 5

      - name: Validate packaging (npx compatibility)
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # 1. "bin" field must exist in package.json
          BIN_PATH=$(node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin;
            if (!bin) { console.error('missing bin field'); process.exit(1); }
            const entry = typeof bin === 'string' ? bin : Object.values(bin)[0];
            console.log(entry);
          ")
          echo "bin entry: $BIN_PATH"

          # 2. The bin target must exist after build
          if [ ! -f "$BIN_PATH" ]; then
            echo "::error::bin target '$BIN_PATH' not found after build"
            exit 1
          fi

          # 3. Must have a Node.js shebang
          HEAD=$(head -c 30 "$BIN_PATH")
          if [[ "$HEAD" != "#!/usr/bin/env node"* ]]; then
            echo "::error::bin target '$BIN_PATH' is missing shebang (#!/usr/bin/env node)"
            exit 1
          fi

          # 4. npm pack + install in sandbox: verify the command is resolvable
          # stderr stays visible (npm notices, errors); the file name is the last line on stdout
          TARBALL=$(npm pack --pack-destination /tmp | tail -n 1)
          SANDBOX=$(mktemp -d)
          npm install --prefix "$SANDBOX" "/tmp/$TARBALL" --ignore-scripts
          BIN_NAME=$(node -e "
            const bin = require('./package.json').bin;
            console.log(typeof bin === 'string' ? require('./package.json').name.split('/').pop() : Object.keys(bin)[0]);
          ")
          RESOLVED="$SANDBOX/node_modules/.bin/$BIN_NAME"
          if [ ! -e "$RESOLVED" ]; then
            echo "::error::After npm install, bin '$BIN_NAME' not found in $SANDBOX/node_modules/.bin/"
            ls -la "$SANDBOX/node_modules/.bin/" || true
            exit 1
          fi
          echo "npx simulation OK: $RESOLVED"
          rm -rf "$SANDBOX"
