name: Tests

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target the branch below them, not main.
  pull_request:
  # Started on the dependency branch by deps-update.yml (a GITHUB_TOKEN push triggers no other event);
  # the check runs attach to the branch head, i.e. the PR head.
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and PR/ref. On pull requests a newer run cancels the older one (duplicate
# pull_request events for the same head used to run the matrix twice): the cancelled run's checks are
# "cancelled", not failed, and GitHub shows the newest check run of each name for the head commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 22 = minimum supported (engines), 24 = active LTS, 26 = current
        node-version: [22, 24, 26]

    name: test (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3

      # Run outputs (agent-out/, agent-audit/, .vitest/, live-artifacts/) hold library content: never tracked
      - name: No run outputs committed
        run: node scripts/check-tracked-artifacts.mjs
        timeout-minutes: 1

      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts: the native binaries come as optionalDependencies
      - run: npm ci --ignore-scripts
        timeout-minutes: 5

      - run: npm run build
        timeout-minutes: 3

      - run: npm test
        timeout-minutes: 5

      - name: Smoke test built server over stdio
        run: npm run smoke
        timeout-minutes: 2

      - name: E2E tests (built server over stdio, fake Zotero API)
        run: npx vitest run --config vitest.e2e.config.ts
        timeout-minutes: 5

      - name: Validate packaging (npx compatibility)
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # 1. "bin" field must exist in package.json
          BIN_PATH=$(node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin;
            if (!bin) { console.error('missing bin field'); process.exit(1); }
            const entry = typeof bin === 'string' ? bin : Object.values(bin)[0];
            console.log(entry);
          ")
          echo "bin entry: $BIN_PATH"

          # 2. The bin target must exist after build
          if [ ! -f "$BIN_PATH" ]; then
            echo "::error::bin target '$BIN_PATH' not found after build"
            exit 1
          fi

          # 3. Must have a Node.js shebang
          HEAD=$(head -c 30 "$BIN_PATH")
          if [[ "$HEAD" != "#!/usr/bin/env node"* ]]; then
            echo "::error::bin target '$BIN_PATH' is missing shebang (#!/usr/bin/env node)"
            exit 1
          fi

          # 4. npm pack + install in sandbox: verify the command is resolvable
          # stderr stays visible (npm notices, errors); the file name is the last line on stdout
          TARBALL=$(npm pack --pack-destination /tmp | tail -n 1)
          SANDBOX=$(mktemp -d)
          npm install --prefix "$SANDBOX" "/tmp/$TARBALL" --ignore-scripts
          BIN_NAME=$(node -e "
            const bin = require('./package.json').bin;
            console.log(typeof bin === 'string' ? require('./package.json').name.split('/').pop() : Object.keys(bin)[0]);
          ")
          RESOLVED="$SANDBOX/node_modules/.bin/$BIN_NAME"
          if [ ! -e "$RESOLVED" ]; then
            echo "::error::After npm install, bin '$BIN_NAME' not found in $SANDBOX/node_modules/.bin/"
            ls -la "$SANDBOX/node_modules/.bin/" || true
            exit 1
          fi
          echo "npx simulation OK: $RESOLVED"
          rm -rf "$SANDBOX"

      # Claude Desktop extension: manifest schema, then the bundle (clean build + production dependencies only),
      # unpacked outside the workspace and started as a client would from its manifest (stubbed fetch, fake key)
      - name: Validate MCPB manifest
        run: npx mcpb validate manifest.json
        timeout-minutes: 1

      - name: Build the .mcpb bundle and smoke-test it unpacked
        timeout-minutes: 8
        run: |
          npm run bundle
          npm run smoke -- --bundle dist/mcp-zotero.mcpb

  # Path filter of the word-proxy job (scripts/word-proxy-scope.mjs): a job-level `if`, so docs-only PRs skip it
  # and the rest of the workflow is never filtered.
  word-proxy-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope of the word-proxy job
        id: scope
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/word-proxy-scope.mjs < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Word checklist proxy: the documents injected by the built server (real corpus, placeholder libraries
  # users/000000 and groups/777, fake Zotero API) refreshed by the official Zotero desktop build under Xvfb through
  # wordcraft-cli (Zotero's word-processor protocol), checked against test/word-proxy/expect.json. No secrets, no
  # account, no network beyond the pinned downloads. Not a required check.
  word-proxy:
    name: word-proxy (Zotero desktop + WordCraft)
    needs: word-proxy-scope
    if: needs.word-proxy-scope.outputs.run == 'true'
    # pinned: ubuntu-latest moves to a new release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      - name: Zotero and WordCraft (pinned, sha256, cached)
        id: tools
        uses: ./.github/actions/word-tools
        timeout-minutes: 8
      - name: Inject, refresh through Zotero, check expectations
        timeout-minutes: 7
        env:
          XVFB: Xvfb
          ZOTERO_DIR: ${{ steps.tools.outputs.zotero }}
          WORDCRAFT_CLI: ${{ steps.tools.outputs.wordcraft }}
        run: timeout 400 test/word-proxy/ci.sh "$ZOTERO_DIR" "$WORDCRAFT_CLI" "$RUNNER_TEMP/word-proxy" test/word-proxy/expect.json
      # Only placeholder data, but checked anyway (fail closed): nothing is uploaded if the check fails
      - name: Collect and check the artifact
        id: artifact
        if: failure()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/word-proxy" U="$RUNNER_TEMP/word-proxy-artifact"
          mkdir -p "$U"
          for s in embedded library; do
            [ -d "$W/$s" ] || continue
            mkdir -p "$U/$s"
            cp "$W/$s"/*.docx "$W/$s"/*.trace "$W/$s"/events.jsonl "$W/$s"/report.json "$U/$s/" 2>/dev/null || true
          done
          cp -r "$W/docs" "$U/" 2>/dev/null || true
          cp "$W/ab.json" "$U/" 2>/dev/null || true
          node test/word-proxy/check-artifacts.mjs "$U"
      - name: Upload documents, traces and reports
        if: failure() && steps.artifact.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-proxy
          path: ${{ runner.temp }}/word-proxy-artifact/
          retention-days: 1
          if-no-files-found: warn
