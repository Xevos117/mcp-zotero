name: Agent smoke test

# A real Claude Code agent (claude-code-action, Agent SDK) uses the MCP server like a user, following
# the versioned skill .claude/skills/test-mcp-zotero. The verdict is NOT the agent's: it comes from
# test/live/verify-claims.mjs, which checks the agent's claims against the Zotero Web API.
# Environment `zotero-live`: the live-test Zotero secrets, plus the Anthropic Workload Identity
# Federation VARIABLES (no API key): ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
# ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID. The federation rule is bound to
# repo:<owner>/<repo>:environment:zotero-live, so the agent job must run in this environment.
#
# Jobs keep credentials apart: `prepare` (no id-token) installs with --ignore-scripts, builds, checks the
# test account and takes the lock; `agent-smoke-run` is the only job with id-token (for the federation
# exchange) and runs no npm; `agent-smoke-verify` (no id-token) verifies the claims; `agent-smoke` decides the
# required check; `agent-smoke-cleanup` cleans up and releases the lock.
# Triggers: pull requests (contextual to the change) and manual runs. No `push`: claude-code-action does not
# support push events ("Unsupported event type: push"); main is covered by a manual run after a merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Same scheme as live-tests.yml: per-PR group, no cancellation of a running agent (it writes to the test
# account; a newer push queues), cross-PR serialization by the Zotero-side lock. agent-smoke-cleanup still runs
# with always() if a run is cancelled by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed files
        id: filter
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/|skills/zotero-skill-mcp-integrations/|\.claude/skills/test-mcp-zotero/|\.claude/agent-smoke/|test/live/agent/|test/live/verify-claims\.mjs|test/live/lock\.mjs|test/live/cleanup\.mjs|test/live/global-setup\.ts|test/live/scrub-report\.mjs|test/live/helpers/|test/fixtures/csl/|test/e2e/server-process\.ts|vitest\.live\.config\.ts|test/helpers/docx-validate\.ts|package(-lock)?\.json|tsconfig\.json|\.github/workflows/claude-agent-smoke\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: agent-smoke-prepare
    needs: changes
    # same-repo PRs and manual runs (workflow_dispatch, e.g. on main); Dependabot gets no secrets; only the owner's or a bot's changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.actor == github.repository_owner || endsWith(github.actor, '[bot]')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 85
    permissions:
      contents: read
    outputs:
      available: ${{ steps.skill.outputs.available }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm

      # On pull requests claude-code-action restores .claude/ and CLAUDE.md from the PR base branch
      # (PR-authored agent config is untrusted), so the skill that runs is the base branch's version.
      - name: Skill available
        id: skill
        timeout-minutes: 1
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Only a pull request whose base branch does not have the skill yet may skip; anywhere else a missing
        # skill (or an unresolvable base ref) is an error, never a silent pass.
        run: |
          path=.claude/skills/test-mcp-zotero/SKILL.md
          if [ "$EVENT" = "pull_request" ]; then
            if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
              echo "::error::base ref origin/$BASE_REF cannot be resolved"
              exit 1
            fi
            if git cat-file -e "origin/$BASE_REF:$path" 2>/dev/null; then found=true; else found=false; fi
            echo "available=$found" >> "$GITHUB_OUTPUT"
            if [ "$found" != "true" ]; then
              echo "::notice::$path is not on the base branch yet: agent smoke skipped (it runs from main after merge)"
            fi
          else
            if [ ! -f "$path" ]; then
              echo "::error::$path missing on $GITHUB_REF: the agent smoke test cannot run"
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require secrets and federation variables
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          if [ -z "$ZOTERO_TEST_API_KEY" ] || [ -z "$ZOTERO_TEST_USERNAME" ] || [ -z "$FEDERATION_RULE_ID" ] || [ -z "$ORGANIZATION_ID" ]; then
            echo "::error::zotero-live environment incomplete (secrets ZOTERO_TEST_API_KEY, ZOTERO_TEST_USERNAME; variables ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID)"
            exit 1
          fi
      - if: steps.skill.outputs.available == 'true'
        run: npm ci --ignore-scripts
        timeout-minutes: 5
      - if: steps.skill.outputs.available == 'true'
        run: npm run build
        timeout-minutes: 3

      # Writes agent-out/context.json and diff.txt; in CI mode it refuses to continue unless the key
      # belongs to ZOTERO_TEST_USERNAME and the library has the __mzt_disposable__ sentinel.
      - name: Prepare agent-out (test account, run id, diff)
        id: prepare
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          AGENT_UNSAFE_OPERATIONS: all
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            *) base="origin/main" ;;
          esac
          node test/live/agent/prepare.mjs --mode ci --base "$base"
          echo "run_id=$(node -p 'require("./agent-out/context.json").run_id')" >> "$GITHUB_OUTPUT"

      # Same lock as the live suite: one run at a time on the Zotero test account (waits up to 70 min:
      # another agent run holds it for up to about 80 min). Released by the agent-smoke job, always.
      - name: Lock the test account
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 72
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_LIVE_LOCK_WAIT_MIN: "70"
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        run: node test/live/lock.mjs acquire "$RUN_ID"

      # Artifacts of a public repo are readable by anyone: identifiers are replaced by placeholders
      # (restored in the next jobs) and the step fails if any of them, or a secret, survives.
      - name: Redact agent-out
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/agent/redact.mjs redact agent-out
      - name: Pack the workspace for the agent job
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        run: tar -czf "$RUNNER_TEMP/workspace.tgz" build node_modules agent-out
      - if: steps.skill.outputs.available == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-workspace
          path: ${{ runner.temp }}/workspace.tgz
          retention-days: 1
          if-no-files-found: error
      # a failed or cancelled prepare must not leave the test account locked for 180 min
      - name: Release the lock if prepare failed
        if: (failure() || cancelled()) && steps.prepare.outputs.run_id != ''
        timeout-minutes: 3
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        run: node test/live/lock.mjs release "$RUN_ID"

  agent-run:
    name: agent-smoke-run
    needs: prepare
    if: needs.prepare.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 55
    permissions:
      contents: read
      # Only job with an OIDC token: the Anthropic federation exchange, done by the action itself. The
      # action removes ACTIONS_ID_TOKEN_REQUEST_* from the agent's environment; no npm runs here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - name: Restore agent-out
        timeout-minutes: 2
        env:
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: |
          node test/live/agent/redact.mjs restore agent-out
          # run settings for the hooks of .claude/agent-smoke, where the agent cannot edit them
          mkdir -p agent-audit && cp agent-out/context.json agent-audit/context.json

      # The MCP server is configured here, from the same template used locally
      # (test/live/agent/mcp.template.json); the agent never configures MCP. The Zotero key goes only into
      # this file (mode 600, removed after the agent step); the agent's environment never contains it.
      - name: MCP config for the agent
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          UNSAFE_OPERATIONS: all
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: node test/live/agent/render-mcp.mjs "$MCP_CONFIG"

      # Tools: --tools limits the built-in set to what the skill uses (Write is needed to create files; its
      # permission rule is Edit(...)); --permission-mode dontAsk denies anything the allow rules do not cover,
      # without prompting. The two commands are wrappers that keep every path inside agent-out/.
      # Hooks (--settings .claude/agent-smoke/settings.json; on pull requests the action restores .claude/ from
      # the base branch, so the PR cannot change them): Bash allowlist of the exact command shapes, deletions
      # only of keys this run created, and an audit log of every Zotero call and Bash command
      # (agent-audit/audit.jsonl, outside agent-out/) that verify-claims uses as evidence.
      - name: Claude Code agent (skill test-mcp-zotero)
        id: claude
        timeout-minutes: 45
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          MCP_TIMEOUT: "30000"
          MCP_TOOL_TIMEOUT: "120000"
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # read-only token: no Claude App token exchange, no write access for the agent
          github_token: ${{ github.token }}
          # runs started by deps-update.yml (workflow_dispatch with GITHUB_TOKEN) have this bot as actor;
          # agent mode refuses non-human actors otherwise. Only this bot, never "*".
          allowed_bots: "github-actions[bot]"
          prompt: "Carica la skill test-mcp-zotero e segui il percorso. Diff in agent-out/diff.txt."
          claude_args: >-
            --model claude-sonnet-5-5
            --tools "Skill,Read,Edit,Write,Bash"
            --permission-mode dontAsk
            --settings .claude/agent-smoke/settings.json
            --max-turns 160
            --max-budget-usd 10
            --mcp-config ${{ runner.temp }}/mcp-zotero.json
            --strict-mcp-config
            --allowedTools "Skill,mcp__zotero__*,Read(./agent-out/**),Edit(./agent-out/**),Bash(node test/live/agent/make-docx.mjs *),Bash(node test/live/agent/inject.mjs *)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"scenarios":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"status":{"type":"string","enum":["passed","failed","skipped"]},"notes":{"type":"string"}},"required":["id","status"]}},"friction":{"type":"array","items":{"type":"object","properties":{"tool":{"type":"string"},"note":{"type":"string"}},"required":["tool","note"]}}},"required":["summary","scenarios"]}'

      - name: Remove the MCP config
        if: always()
        timeout-minutes: 1
        env:
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: rm -f "$MCP_CONFIG"

      - name: Collect the agent output
        if: always()
        timeout-minutes: 2
        env:
          AGENT_REPORT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p agent-out
          if [ -n "$AGENT_REPORT" ]; then printf '%s' "$AGENT_REPORT" > agent-out/agent-report.json; else echo '{}' > agent-out/agent-report.json; fi
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then cp "$EXECUTION_FILE" agent-out/execution.json; fi
          for f in audit.jsonl denials.jsonl; do if [ -f "agent-audit/$f" ]; then cp "agent-audit/$f" "agent-out/$f"; fi; done
          # the context the hooks read (the agent cannot edit it): verify-claims compares agent-out/context.json with it
          if [ -f agent-audit/context.json ]; then cp agent-audit/context.json agent-out/audit-context.json; fi
      # Passed to the verifier with identifiers replaced by placeholders (restored there); the step fails,
      # and nothing is uploaded, if any identifier or secret survives.
      - name: Redact the agent output
        if: always()
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: |
          node test/live/agent/redact.mjs redact agent-out || { rm -rf agent-out; exit 1; }
      - if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: agent-out/
          retention-days: 1
          if-no-files-found: warn

  # The deterministic verdict on the agent's claims. No id-token here. Not after a workflow cancellation (a
  # superseded run); cleanup and the lock release are the separate agent-smoke-cleanup job, the required check
  # is the agent-smoke job below.
  verify:
    name: agent-smoke-verify
    needs: [changes, prepare, agent-run]
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Outcome of the previous jobs
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AVAILABLE: ${{ needs.prepare.outputs.available }}
        run: |
          if [ "$PREPARE" = "success" ] && [ "$AVAILABLE" != "true" ]; then
            echo "::notice::skill not on the base branch yet: nothing to verify"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != '' && needs.agent-run.result != 'skipped'
        continue-on-error: true # no output if the agent job failed early: verify-claims reports it
        timeout-minutes: 5
        with:
          name: agent-output
          path: agent-out
      - name: Restore agent-out
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/agent/redact.mjs restore agent-out

      # Deterministic verdict on the claims, audit and transcript of this workflow run (entries are checked
      # against its run id). Always after a successful agent step: a missing audit then fails verify-claims (no
      # green check without evidence). After a failed agent step only if an audit exists, for the per-call safety
      # and robustness report (the agent-smoke check is red anyway); without one there is nothing to report.
      - name: No agent calls recorded
        if: needs.prepare.outputs.run_id != '' && hashFiles('agent-out/audit.jsonl') == '' && needs.agent-run.result != 'success'
        timeout-minutes: 1
        env:
          AGENT: ${{ needs.agent-run.result }}
        run: echo "::notice::no audit log (agent step ${AGENT}, no recorded call) - nothing to verify"
      - name: Verify the agent's claims
        id: verify
        if: needs.prepare.outputs.run_id != '' && (hashFiles('agent-out/audit.jsonl') != '' || needs.agent-run.result == 'success')
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
        run: node test/live/verify-claims.mjs agent-out --audit agent-out/audit.jsonl --transcript agent-out/execution.json

      - name: Scrub agent output
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: node test/live/scrub-report.mjs live-artifacts agent-out
      - name: Upload scrubbed agent output
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-smoke
          path: live-artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if a previous job failed
        if: always()
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AGENT: ${{ needs.agent-run.result }}
        run: |
          if [ "$PREPARE" = "failure" ] || [ "$PREPARE" = "cancelled" ]; then echo "::error::agent-smoke-prepare: $PREPARE"; exit 1; fi
          if [ "$AGENT" = "failure" ] || [ "$AGENT" = "cancelled" ]; then echo "::error::agent-smoke-run: $AGENT"; exit 1; fi

  # The required check. It runs unless the workflow itself was cancelled (a superseded run ends "cancelled",
  # not red) and is never skipped, since a skipped required check counts as passed: a failed `changes` job, or a
  # failed or timed-out (concluded "cancelled") prepare, agent or verify job, makes it fail. It passes without
  # an agent run only when `changes` succeeded and found nothing relevant, for fork PRs and Dependabot (no
  # secrets), or on a pull request whose base branch does not have the skill yet.
  verdict:
    name: agent-smoke # required check name
    needs: [changes, prepare, agent-run, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Outcome of the agent smoke test
        timeout-minutes: 1
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          PREPARE: ${{ needs.prepare.result }}
          AVAILABLE: ${{ needs.prepare.outputs.available }}
          AGENT: ${{ needs.agent-run.result }}
          VERIFY: ${{ needs.verify.result }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes: $CHANGES (the file filter must succeed, or the check would pass without running)"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then echo "::notice::no change relevant to the agent smoke test"; exit 0; fi
          if [ "$PREPARE" = "skipped" ]; then
            # same conditions as the prepare job's `if`, to name the one that applied
            if [ "$ACTOR" = "dependabot[bot]" ]; then reason="Dependabot runs get no secrets"
            elif [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then reason="fork PR ($HEAD_REPO): no secrets"
            elif [ "$ACTOR" != "$OWNER" ] && [ "${ACTOR%\[bot\]}" = "$ACTOR" ]; then reason="actor $ACTOR is neither the repository owner nor a bot"
            else reason="prepare skipped by its conditions"; fi
            echo "::notice::agent smoke not run for this event: $reason"
            exit 0
          fi
          if [ "$PREPARE" != "success" ]; then echo "::error::agent-smoke-prepare: $PREPARE"; exit 1; fi
          if [ "$AVAILABLE" != "true" ]; then echo "::notice::skill not on the base branch yet: nothing to verify"; exit 0; fi
          if [ "$AGENT" != "success" ]; then echo "::error::agent-smoke-run: $AGENT"; exit 1; fi
          if [ "$VERIFY" != "success" ]; then echo "::error::agent-smoke-verify: $VERIFY"; exit 1; fi
          echo "agent smoke verified"

  # Removes what the run created and releases the test-account lock after the verdict, and also when the
  # workflow is cancelled or a job failed (always()). It does not decide the check.
  cleanup:
    name: agent-smoke-cleanup
    needs: [prepare, agent-run, verify]
    if: always() && needs.prepare.outputs.run_id != ''
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - name: Clean up the agent's run
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: npm run test:live:cleanup -- "$RUN_ID"
      - name: Release the test-account lock
        if: always()
        timeout-minutes: 3
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node test/live/lock.mjs release "$RUN_ID"
