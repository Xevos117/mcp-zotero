name: Agent smoke test

# A real Claude Code agent (claude-code-action, Agent SDK) uses the MCP server like a user, following
# the versioned skill .claude/skills/test-mcp-zotero. The verdict is NOT the agent's: it comes from
# test/live/verify-claims.mjs, which checks the agent's claims against the Zotero Web API.
# Environment `zotero-live`: the live-test Zotero secrets, plus the Anthropic Workload Identity
# Federation VARIABLES (no API key): ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
# ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID. The federation rule is bound to
# repo:<owner>/<repo>:environment:zotero-live, so the agent job must run in this environment.
#
# Three jobs keep credentials apart: `prepare` (no id-token) installs with --ignore-scripts, builds,
# checks the test account and takes the lock; `agent-smoke-run` is the only job with id-token (for the
# federation exchange) and runs no npm; `agent-smoke` (no id-token) verifies the claims, cleans up,
# releases the lock and decides the check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Same scheme as live-tests.yml: per-PR group, cross-PR serialization by the Zotero-side lock.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed files
        id: filter
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/|skills/zotero-skill-mcp-integrations/|\.claude/skills/test-mcp-zotero/|test/live/agent/|test/live/verify-claims\.mjs|test/live/lock\.mjs|test/helpers/docx-validate\.ts|package(-lock)?\.json|tsconfig\.json|\.github/workflows/claude-agent-smoke\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: agent-smoke-prepare
    needs: changes
    # same-repo PRs, main, manual runs; Dependabot gets no secrets; only the owner's or a bot's changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.actor == github.repository_owner || endsWith(github.actor, '[bot]')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      available: ${{ steps.skill.outputs.available }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm

      # On pull requests claude-code-action restores .claude/ and CLAUDE.md from the PR base branch
      # (PR-authored agent config is untrusted), so the skill that runs is the base branch's version.
      - name: Skill available
        id: skill
        timeout-minutes: 1
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          path=.claude/skills/test-mcp-zotero/SKILL.md
          if [ "$EVENT" = "pull_request" ]; then
            git cat-file -e "origin/$BASE_REF:$path" 2>/dev/null && found=true || found=false
          else
            [ -f "$path" ] && found=true || found=false
          fi
          echo "available=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != "true" ]; then
            echo "::notice::$path is not on the base branch yet: agent smoke skipped (it runs from main after merge)"
          fi

      - name: Require secrets and federation variables
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          if [ -z "$ZOTERO_TEST_API_KEY" ] || [ -z "$ZOTERO_TEST_USERNAME" ] || [ -z "$FEDERATION_RULE_ID" ] || [ -z "$ORGANIZATION_ID" ]; then
            echo "::error::zotero-live environment incomplete (secrets ZOTERO_TEST_API_KEY, ZOTERO_TEST_USERNAME; variables ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID)"
            exit 1
          fi
      - if: steps.skill.outputs.available == 'true'
        run: npm ci --ignore-scripts
        timeout-minutes: 5
      - if: steps.skill.outputs.available == 'true'
        run: npm run build
        timeout-minutes: 3

      # Writes agent-out/context.json and diff.txt; in CI mode it refuses to continue unless the key
      # belongs to ZOTERO_TEST_USERNAME and the library has the __mzt_disposable__ sentinel.
      - name: Prepare agent-out (test account, run id, diff)
        id: prepare
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          AGENT_UNSAFE_OPERATIONS: all
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="HEAD~1" ;;
            *) base="origin/main" ;;
          esac
          node test/live/agent/prepare.mjs --mode ci --base "$base"
          echo "run_id=$(node -p 'require("./agent-out/context.json").run_id')" >> "$GITHUB_OUTPUT"

      # Same lock as the live suite: one run at a time on the Zotero test account (waits up to 25 min).
      # Released by the agent-smoke job, always.
      - name: Lock the test account
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 27
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        run: node test/live/lock.mjs acquire "$RUN_ID"

      - name: Pack the workspace for the agent job
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        run: tar -czf "$RUNNER_TEMP/workspace.tgz" build node_modules agent-out
      - if: steps.skill.outputs.available == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-workspace
          path: ${{ runner.temp }}/workspace.tgz
          retention-days: 1
          if-no-files-found: error

  agent-run:
    name: agent-smoke-run
    needs: prepare
    if: needs.prepare.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 35
    permissions:
      contents: read
      # Only job with an OIDC token: the Anthropic federation exchange, done by the action itself. The
      # action removes ACTIONS_ID_TOKEN_REQUEST_* from the agent's environment; no npm runs here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"

      # The Zotero key goes only into this file; the agent's environment never contains it.
      - name: MCP config for the agent
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: |
          umask 077
          node -e '
            const env = { ZOTERO_API_KEY: process.env.ZOTERO_TEST_API_KEY, ZOTERO_USER_ID: process.env.ZOTERO_TEST_USER_ID, UNSAFE_OPERATIONS: "all" };
            if (process.env.UNPAYWALL_EMAIL) env.UNPAYWALL_EMAIL = process.env.UNPAYWALL_EMAIL;
            const config = { mcpServers: { zotero: { command: process.execPath, args: [process.cwd() + "/build/server.js"], env } } };
            require("fs").writeFileSync(process.env.MCP_CONFIG, JSON.stringify(config));
          '

      # Tool rules: Edit(...) also governs Write; reads inside the checkout are allowed by Claude Code
      # anyway, while the MCP config in $RUNNER_TEMP is outside it. Any other command is denied (-p mode).
      # The two commands are wrappers that keep every path inside agent-out/.
      - name: Claude Code agent (skill test-mcp-zotero)
        id: claude
        timeout-minutes: 25
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          MCP_TIMEOUT: "30000"
          MCP_TOOL_TIMEOUT: "120000"
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # read-only token: no Claude App token exchange, no write access for the agent
          github_token: ${{ github.token }}
          prompt: "Carica la skill test-mcp-zotero e segui il percorso. Diff in agent-out/diff.txt."
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --max-budget-usd 5
            --mcp-config ${{ runner.temp }}/mcp-zotero.json
            --strict-mcp-config
            --allowedTools "Skill,mcp__zotero__*,Read(./agent-out/**),Edit(./agent-out/**),Bash(node test/live/agent/make-docx.mjs *),Bash(node test/live/agent/inject.mjs *)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"scenarios":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"status":{"type":"string","enum":["passed","failed","skipped"]},"notes":{"type":"string"}},"required":["id","status"]}},"friction":{"type":"array","items":{"type":"object","properties":{"tool":{"type":"string"},"note":{"type":"string"}},"required":["tool","note"]}}},"required":["summary","scenarios"]}'

      - name: Remove the MCP config
        if: always()
        timeout-minutes: 1
        env:
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: rm -f "$MCP_CONFIG"

      - name: Collect the agent output
        if: always()
        timeout-minutes: 2
        env:
          AGENT_REPORT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p agent-out
          if [ -n "$AGENT_REPORT" ]; then printf '%s' "$AGENT_REPORT" > agent-out/agent-report.json; else echo '{}' > agent-out/agent-report.json; fi
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then cp "$EXECUTION_FILE" agent-out/execution.json; fi
      # The raw output (needed by the verifier: docx, claims, transcript) is uploaded only if neither the
      # Zotero key nor the Unpaywall email is in it; the 7-day artifact is scrubbed by the next job.
      - name: Check the agent output for secrets
        if: always()
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          for secret in "$ZOTERO_TEST_API_KEY" "$UNPAYWALL_EMAIL"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" agent-out; then
              echo "::error::a secret appears in the agent output: not uploading it"
              rm -rf agent-out
              exit 1
            fi
          done
      - if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: agent-out/
          retention-days: 1
          if-no-files-found: warn

  # The required check: the deterministic verdict, cleanup and lock release. No id-token here.
  verify:
    name: agent-smoke
    needs: [changes, prepare, agent-run]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Outcome of the previous jobs
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AVAILABLE: ${{ needs.prepare.outputs.available }}
        run: |
          if [ "$PREPARE" = "success" ] && [ "$AVAILABLE" != "true" ]; then
            echo "::notice::skill not on the base branch yet: nothing to verify"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != '' && needs.agent-run.result != 'skipped'
        continue-on-error: true # no output if the agent job failed early: verify-claims reports it
        timeout-minutes: 5
        with:
          name: agent-output
          path: agent-out

      # Deterministic verdict: this step, not the agent, decides the check.
      - name: Verify the agent's claims
        id: verify
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
        run: node test/live/verify-claims.mjs agent-out --transcript agent-out/execution.json

      - name: Clean up the agent's run
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: npm run test:live:cleanup -- "$RUN_ID"

      - name: Release the test-account lock
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node test/live/lock.mjs release "$RUN_ID"

      - name: Scrub agent output
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: node test/live/scrub-report.mjs live-artifacts agent-out
      - name: Upload scrubbed agent output
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-smoke
          path: live-artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if a previous job failed
        if: always()
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AGENT: ${{ needs.agent-run.result }}
        run: |
          if [ "$PREPARE" != "success" ]; then echo "::error::agent-smoke-prepare: $PREPARE"; exit 1; fi
          if [ "$AGENT" = "failure" ] || [ "$AGENT" = "cancelled" ]; then echo "::error::agent-smoke-run: $AGENT"; exit 1; fi
