name: Live tests + agent smoke

# One workflow for everything that uses the Zotero test account (environment `zotero-live`):
#   changes → live-tests-run (test/live against the real Web API)
#           → [slot: word-render, between the live suite and the agent; not implemented yet]
#           → agent-smoke-prepare → agent-smoke-run → agent-smoke-verify (→ agent-smoke-comment on PRs)
#   verdicts: live-tests, agent-smoke (required checks, never skipped); agent-smoke-cleanup (always);
#   live-tests-weekly-issue (scheduled failures only).
# The agent runs only after the live suite passed: a red live run spends no API credits.
#
# Secrets (environment `zotero-live`, step level only): ZOTERO_TEST_API_KEY, ZOTERO_TEST_USER_ID,
# ZOTERO_TEST_USERNAME, ZOTERO_TEST_GROUP_ID (optional), UNPAYWALL_EMAIL. Variables for the Anthropic Workload
# Identity Federation of the agent job (no API key): ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
# ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID. The federation rule is bound to
# repo:<owner>/<repo>:environment:zotero-live and to this workflow file (job_workflow_ref), so the agent job
# runs in that environment and the file keeps its name.
#
# A real Claude agent (Claude Agent SDK, scripts/run-agent.mjs) uses the MCP server like a user, following the
# versioned skill .claude/skills/test-mcp-zotero; the verdict is NOT the agent's: test/live/verify-claims.mjs
# checks its claims against the Zotero Web API. Jobs keep credentials apart: prepare (no id-token) installs with
# --ignore-scripts, builds, checks the account and takes the lock; agent-smoke-run is the only job with id-token
# and runs no npm; verify has no id-token; the comment job can only write pull requests; the weekly issue job
# can only write issues.
on:
  # No base-branch filter (stacked PRs). Fork PRs get no secrets: the jobs are skipped by their `if`.
  pull_request:
  # live suite only
  push:
    branches: [main]
  schedule:
    # weekly on Friday, live suite only: notices changes in Zotero, doi.org, Unpaywall or publishers
    - cron: "23 3 * * 5"
  # also started by deps-update.yml on its dependency branch (default scope: both required checks)
  workflow_dispatch:
    inputs:
      scope:
        description: "live = live suite only; live+agent = live suite, then the agent smoke test"
        type: choice
        options: ["live+agent", "live"]
        default: "live+agent"

permissions:
  contents: read

# One group per PR/ref. A running run is never cancelled by a newer push: a cancel in the middle of a run left
# items and collections on the test account (its cleanup was cut short), so the newer run queues instead (GitHub
# keeps only the newest pending run of the group). Overlapping runs of different groups (PRs, schedule, manual
# runs) are serialized on the Zotero side by test/live/lock.mjs: a queued live run waits up to 70 min, an agent
# run holds the account for up to about 80 min. agent-smoke-cleanup still runs with always() after a manual cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Path filter at job level (not `on.paths`): a required check that never starts would block docs-only PRs.
  # scripts/live-scope.mjs decides what runs (pull requests: by the changed files; push and schedule: the live
  # suite; manual: the `scope` input); the verdict jobs decide the required checks from it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live: ${{ steps.scope.outputs.live }}
      agent: ${{ steps.scope.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope of the run
        id: scope
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | tee "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/live-scope.mjs < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # The live suite. Secrets only at step level, in the steps that talk to Zotero (never during npm ci or the build).
  live:
    name: live-tests-run
    needs: changes
    if: >-
      needs.changes.outputs.live == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm
      # First step that touches the account: the test group's name is read in-process (never printed), masked in every
      # later log line of the job and exported as ZOTERO_TEST_GROUP_NAME for the fail-closed check of scrub-report.mjs
      # (test/live/mask-group-name.mjs).
      - name: Mask the test group name
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/mask-group-name.mjs
      - name: Require the test account
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
        run: |
          # without the key the suite would be skipped and the check would pass vacuously
          if [ -z "$ZOTERO_TEST_API_KEY" ] || [ -z "$ZOTERO_TEST_USERNAME" ]; then
            echo "::error::zotero-live environment secrets missing (ZOTERO_TEST_API_KEY, ZOTERO_TEST_USERNAME)"
            exit 1
          fi
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 3
      # Up to 70 min waiting for the test-account lock + ~5 min of tests; shorter than the job, so the
      # always() steps below still have time to clean up and release the lock.
      - name: Live suite
        timeout-minutes: 85
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          # more than 2 cases skipped because an external service was down → the run fails
          ZOTERO_LIVE_MAX_SOFT_SKIPS: "2"
          ZOTERO_LIVE_LOCK_WAIT_MIN: "70"
        run: npx vitest run --config vitest.live.config.ts
      - name: Clean up interrupted runs
        if: always()
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        # After a cancellation the suite's processes (vitest and the MCP servers it spawned) can outlive the
        # step and keep creating items while the cleanup runs (run mv4wuscp-4e2f left 5 items and 2
        # collections): stop them first, then clean up.
        run: |
          # node processes only (the pattern never matches a shell whose command line contains it)
          pattern='^[^ ]*node (.* )?[^ ]*(vitest\.live\.config\.ts|node_modules/vitest/|/build/server\.js)'
          pkill -INT -f "$pattern" || true
          for _ in $(seq 1 15); do pgrep -f "$pattern" > /dev/null || break; sleep 1; done
          pkill -KILL -f "$pattern" || true
          npm run test:live:cleanup
      - name: Scrub report
        id: scrub
        if: always()
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: node test/live/scrub-report.mjs live-artifacts .vitest/live-report.json .vitest/live-summary.json
      # Only what the scrubber accepted: after a failed scrub nothing is published (and the job is red)
      - name: Upload scrubbed report
        if: always() && steps.scrub.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-report
          path: live-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ── Slot: word-render ───────────────────────────────────────────────────────────────────────────────────
  # A future job between the live suite and the agent (needs: live, run only if it succeeded; the agent jobs then
  # also need it). Not implemented here.

  prepare:
    name: agent-smoke-prepare
    needs: [changes, live]
    # Only after a passing live suite. Same-repo PRs and manual runs (workflow_dispatch, e.g. on main); Dependabot
    # gets no secrets; the agent costs API credits, so only the owner's changes and the deps workflow's runs
    # (github-actions[bot]) start it automatically
    if: >-
      needs.changes.outputs.agent == 'true' &&
      needs.live.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.actor == github.repository_owner || github.actor == 'github-actions[bot]') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 85
    permissions:
      contents: read
    outputs:
      available: ${{ steps.skill.outputs.available }}
      run_id: ${{ steps.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
          cache: npm

      # On pull requests the agent job restores .claude/ and CLAUDE.md from the PR base branch
      # (PR-authored agent config is untrusted), so the skill that runs is the base branch's version.
      - name: Skill available
        id: skill
        timeout-minutes: 1
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Only a pull request whose base branch does not have the skill yet may skip; anywhere else a missing
        # skill (or an unresolvable base ref) is an error, never a silent pass.
        run: |
          path=.claude/skills/test-mcp-zotero/SKILL.md
          if [ "$EVENT" = "pull_request" ]; then
            if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
              echo "::error::base ref origin/$BASE_REF cannot be resolved"
              exit 1
            fi
            if git cat-file -e "origin/$BASE_REF:$path" 2>/dev/null; then found=true; else found=false; fi
            echo "available=$found" >> "$GITHUB_OUTPUT"
            if [ "$found" != "true" ]; then
              echo "::notice::$path is not on the base branch yet: agent smoke skipped (it runs from main after merge)"
            fi
          else
            if [ ! -f "$path" ]; then
              echo "::error::$path missing on $GITHUB_REF: the agent smoke test cannot run"
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # First step that touches the account: the test group's name is read in-process (never printed), masked in every
      # later log line of the job and exported as ZOTERO_TEST_GROUP_NAME for the fail-closed checks of redact.mjs,
      # scrub-report.mjs and agent/summary.mjs (test/live/mask-group-name.mjs).
      - name: Mask the test group name
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/mask-group-name.mjs
      - name: Require secrets and federation variables
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          if [ -z "$ZOTERO_TEST_API_KEY" ] || [ -z "$ZOTERO_TEST_USERNAME" ] || [ -z "$FEDERATION_RULE_ID" ] || [ -z "$ORGANIZATION_ID" ]; then
            echo "::error::zotero-live environment incomplete (secrets ZOTERO_TEST_API_KEY, ZOTERO_TEST_USERNAME; variables ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID)"
            exit 1
          fi
      - if: steps.skill.outputs.available == 'true'
        run: npm ci --ignore-scripts
        timeout-minutes: 5
      - if: steps.skill.outputs.available == 'true'
        run: npm run build
        timeout-minutes: 3

      # Writes agent-out/context.json and diff.txt; in CI mode it refuses to continue unless the key
      # belongs to ZOTERO_TEST_USERNAME and the library has the __mzt_disposable__ sentinel.
      - name: Prepare agent-out (test account, run id, diff)
        id: prepare
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          AGENT_UNSAFE_OPERATIONS: all
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            *) base="origin/main" ;;
          esac
          node test/live/agent/prepare.mjs --mode ci --base "$base"
          echo "run_id=$(node -p 'require("./agent-out/context.json").run_id')" >> "$GITHUB_OUTPUT"

      # Same lock as the live suite: one run at a time on the Zotero test account (waits up to 70 min:
      # another agent run holds it for up to about 80 min). Released by the agent-smoke job, always.
      - name: Lock the test account
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 72
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_LIVE_LOCK_WAIT_MIN: "70"
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        run: node test/live/lock.mjs acquire "$RUN_ID"

      # Artifacts of a public repo are readable by anyone: identifiers are replaced by placeholders
      # (restored in the next jobs) and the step fails if any of them, or a secret, survives.
      - name: Redact agent-out
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/agent/redact.mjs redact agent-out
      - name: Pack the workspace for the agent job
        if: steps.skill.outputs.available == 'true'
        timeout-minutes: 3
        run: tar -czf "$RUNNER_TEMP/workspace.tgz" build node_modules agent-out
      - if: steps.skill.outputs.available == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-workspace
          path: ${{ runner.temp }}/workspace.tgz
          retention-days: 1
          if-no-files-found: error
      # a failed or cancelled prepare must not leave the test account locked for 180 min
      - name: Release the lock if prepare failed
        if: (failure() || cancelled()) && steps.prepare.outputs.run_id != ''
        timeout-minutes: 3
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        run: node test/live/lock.mjs release "$RUN_ID"

  agent-run:
    name: agent-smoke-run
    needs: prepare
    if: needs.prepare.outputs.available == 'true'
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 55
    permissions:
      contents: read
      # Only job with an OIDC token: the Anthropic federation exchange, prepared by scripts/run-agent.mjs, which
      # removes ACTIONS_ID_TOKEN_REQUEST_* from the agent's environment; no npm runs here.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
      # First step that touches the account: the test group's name is read in-process (never printed), masked in every
      # later log line of the job and exported as ZOTERO_TEST_GROUP_NAME for the fail-closed checks of redact.mjs,
      # scrub-report.mjs and agent/summary.mjs (test/live/mask-group-name.mjs).
      - name: Mask the test group name
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/mask-group-name.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - name: Restore agent-out
        timeout-minutes: 2
        env:
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: |
          node test/live/agent/redact.mjs restore agent-out
          # run settings for the hooks of .claude/agent-smoke, where the agent cannot edit them
          mkdir -p agent-audit && cp agent-out/context.json agent-audit/context.json

      # A pull request's own agent configuration is untrusted: the skill, hooks and instructions the agent follows
      # come from the base branch. Paths missing on the base are removed.
      - name: Agent configuration from the base branch
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          for p in .claude CLAUDE.md CLAUDE.local.md .mcp.json .claude.json; do
            rm -rf "$p"
            if git cat-file -e "origin/$BASE_REF:$p" 2>/dev/null; then git checkout "origin/$BASE_REF" -- "$p"; fi
          done
          test -f .claude/skills/test-mcp-zotero/SKILL.md && test -f .claude/agent-smoke/settings.json

      # The MCP server is configured here, from the same template used locally
      # (test/live/agent/mcp.template.json); the agent never configures MCP. The Zotero key goes only into
      # this file (mode 600, removed after the agent step); the agent's environment never contains it.
      - name: MCP config for the agent
        timeout-minutes: 1
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          UNSAFE_OPERATIONS: all
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: node test/live/agent/render-mcp.mjs "$MCP_CONFIG"

      # Agent: scripts/run-agent.mjs runs the Claude Agent SDK with .github/agents/agent-smoke.json. Tools: `tools`
      # limits the built-in set to what the skill uses (Write is needed to create files; its permission rule is
      # Edit(...)); permission mode dontAsk denies anything the allow rules do not cover, without prompting. The two
      # commands are wrappers that keep every path inside agent-out/. Hooks (.claude/agent-smoke/settings.json, from
      # the base branch on pull requests, see the step above): Bash allowlist of the exact command shapes, deletions
      # only of keys this run created, and an audit log of every Zotero call and Bash command
      # (agent-audit/audit.jsonl, outside agent-out/) that verify-claims uses as evidence. The runner fetches the
      # GitHub OIDC token for the federation exchange and removes ACTIONS_ID_TOKEN_REQUEST_* from the agent's env.
      - name: Claude agent (Agent SDK, skill test-mcp-zotero)
        id: claude
        timeout-minutes: 45
        env:
          MCP_TIMEOUT: "30000"
          MCP_TOOL_TIMEOUT: "120000"
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/run-agent.mjs .github/agents/agent-smoke.json

      - name: Remove the MCP config
        if: always()
        timeout-minutes: 1
        env:
          MCP_CONFIG: ${{ runner.temp }}/mcp-zotero.json
        run: rm -f "$MCP_CONFIG"

      - name: Collect the agent output
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p agent-out
          # written by the runner outside the workspace, so the agent cannot plant them in agent-out/
          rm -f agent-out/agent-report.json agent-out/execution.json
          if [ -s "$RUNNER_TEMP/agent/agent-report.json" ]; then cp "$RUNNER_TEMP/agent/agent-report.json" agent-out/agent-report.json; else echo '{}' > agent-out/agent-report.json; fi
          if [ -f "$RUNNER_TEMP/agent/execution.json" ]; then cp "$RUNNER_TEMP/agent/execution.json" agent-out/execution.json; fi
          for f in audit.jsonl denials.jsonl; do if [ -f "agent-audit/$f" ]; then cp "agent-audit/$f" "agent-out/$f"; fi; done
          # the context the hooks read (the agent cannot edit it): verify-claims compares agent-out/context.json with it
          if [ -f agent-audit/context.json ]; then cp agent-audit/context.json agent-out/audit-context.json; fi
      # Passed to the verifier with identifiers replaced by placeholders (restored there); the step fails,
      # and nothing is uploaded, if any identifier or secret survives.
      - name: Redact the agent output
        if: always()
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: |
          node test/live/agent/redact.mjs redact agent-out || { rm -rf agent-out; exit 1; }
      - if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-output
          path: agent-out/
          retention-days: 1
          if-no-files-found: warn

  # The deterministic verdict on the agent's claims. No id-token here. Not after a workflow cancellation (a
  # superseded run); cleanup and the lock release are the separate agent-smoke-cleanup job, the required check
  # is the agent-smoke job below.
  verify:
    name: agent-smoke-verify
    needs: [changes, prepare, agent-run]
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Outcome of the previous jobs
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AVAILABLE: ${{ needs.prepare.outputs.available }}
        run: |
          if [ "$PREPARE" = "success" ] && [ "$AVAILABLE" != "true" ]; then
            echo "::notice::skill not on the base branch yet: nothing to verify"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        with:
          node-version: 24
      # First step that touches the account: the test group's name is read in-process (never printed), masked in every
      # later log line of the job and exported as ZOTERO_TEST_GROUP_NAME for the fail-closed checks of redact.mjs,
      # scrub-report.mjs and agent/summary.mjs (test/live/mask-group-name.mjs).
      - name: Mask the test group name
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/mask-group-name.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.run_id != '' && needs.agent-run.result != 'skipped'
        continue-on-error: true # no output if the agent job failed early: verify-claims reports it
        timeout-minutes: 5
        with:
          name: agent-output
          path: agent-out
      - name: Restore agent-out
        if: needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/agent/redact.mjs restore agent-out

      # Deterministic verdict on the claims, audit and transcript of this workflow run (entries are checked
      # against its run id). Always after a successful agent step: a missing audit then fails verify-claims (no
      # green check without evidence). After a failed agent step only if an audit exists, for the per-call safety
      # and robustness report (the agent-smoke check is red anyway); without one there is nothing to report.
      - name: No agent calls recorded
        if: needs.prepare.outputs.run_id != '' && hashFiles('agent-out/audit.jsonl') == '' && needs.agent-run.result != 'success'
        timeout-minutes: 1
        env:
          AGENT: ${{ needs.agent-run.result }}
        run: echo "::notice::no audit log (agent step ${AGENT}, no recorded call) - nothing to verify"
      - name: Verify the agent's claims
        id: verify
        if: needs.prepare.outputs.run_id != '' && (hashFiles('agent-out/audit.jsonl') != '' || needs.agent-run.result == 'success')
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
        run: node test/live/verify-claims.mjs agent-out --audit agent-out/audit.jsonl --transcript agent-out/execution.json

      - name: Scrub agent output
        id: scrub
        if: always() && needs.prepare.outputs.run_id != ''
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: node test/live/scrub-report.mjs live-artifacts agent-out
      # Job Summary and PR comment text (verdict, problems, scenarios, exploratory, friction, turns/cost/duration),
      # from the scrubbed copy only: agent/summary.mjs writes nothing if a secret or an identifier of the test
      # account (from the environment, or any users|groups/<id> path) is still in the text.
      - name: Job summary
        id: summary
        if: always() && steps.scrub.outcome == 'success'
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node test/live/agent/summary.mjs live-artifacts/agent-out --out live-artifacts/summary.md
          cat live-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the summary for the PR comment
        if: always() && steps.summary.outcome == 'success' && github.event_name == 'pull_request'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-smoke-summary
          path: live-artifacts/summary.md
          retention-days: 7
          if-no-files-found: error
      # Only what the scrubber accepted: after a failed scrub nothing is published
      - name: Upload scrubbed agent output
        if: always() && steps.scrub.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-smoke
          path: live-artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if a previous job failed
        if: always()
        timeout-minutes: 1
        env:
          PREPARE: ${{ needs.prepare.result }}
          AGENT: ${{ needs.agent-run.result }}
        run: |
          if [ "$PREPARE" = "failure" ] || [ "$PREPARE" = "cancelled" ]; then echo "::error::agent-smoke-prepare: $PREPARE"; exit 1; fi
          if [ "$AGENT" = "failure" ] || [ "$AGENT" = "cancelled" ]; then echo "::error::agent-smoke-run: $AGENT"; exit 1; fi

  # One sticky comment per pull request with the summary of the latest run (found by its marker line, updated by
  # every run). Only same-repo pull requests; the job's token can only write pull requests, and it runs no code of
  # the pull request: no checkout, no npm, no secrets. It posts the text the verify job wrote and checked, after
  # checking again that it has the marker and no users|groups/<id> path.
  comment:
    name: agent-smoke-comment
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true # no summary (scrub or summary failed, or nothing ran): no comment
        timeout-minutes: 3
        with:
          name: agent-smoke-summary
          path: ${{ runner.temp }}/summary
      - name: Create or update the PR comment
        if: steps.download.outcome == 'success'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ runner.temp }}/summary/summary.md
        run: |
          set -euo pipefail
          marker='<!-- mcp-zotero-agent-smoke -->'
          if [ "$(head -n 1 "$SUMMARY")" != "$marker" ]; then echo "::error::summary without the marker line: not posted"; exit 1; fi
          if grep -Eo '\b(users|groups)/[0-9]+' "$SUMMARY" | grep -Evx 'users/100000000000001|groups/200000000000002' | grep -q .; then
            echo "::error::summary with a users/<id> or groups/<id> path: not posted"
            exit 1
          fi
          ids=$(timeout 60 gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            timeout 60 gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$SUMMARY" > /dev/null
          else
            timeout 60 gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$SUMMARY" > /dev/null
          fi

  # Required check `live-tests`. It runs unless the workflow itself was cancelled and is never skipped, since a
  # skipped required check counts as passed: a failed `changes` job, or a failed or timed-out (concluded
  # "cancelled") live-tests-run, makes it fail. It passes without the suite only when `changes` succeeded and found
  # nothing relevant, or for fork PRs and Dependabot, which get no secrets.
  live-verdict:
    name: live-tests # required check name
    needs: [changes, live]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Outcome of the live suite
        timeout-minutes: 1
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.live }}
          LIVE: ${{ needs.live.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes: $CHANGES (the file filter must succeed, or the check would pass without running)"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "::notice::no change relevant to the live suite"
            exit 0
          fi
          case "$LIVE" in
            success) echo "live suite passed" ;;
            skipped) echo "::notice::fork PRs and Dependabot get no secrets: live suite not run" ;;
            *) echo "::error::live-tests-run: $LIVE"; exit 1 ;;
          esac

  # Required check `agent-smoke`. Same rules as live-tests: never skipped, fails when `changes` or a real job
  # failed or timed out, and when the live suite did not pass (the agent then did not run). It passes without an
  # agent run only when the run is out of scope (push, schedule, live-only manual run, no relevant change), for
  # fork PRs and Dependabot (no secrets), for actors other than the owner and github-actions[bot], or on a pull
  # request whose base branch does not have the skill yet.
  agent-verdict:
    name: agent-smoke # required check name
    needs: [changes, live, prepare, agent-run, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Outcome of the agent smoke test
        timeout-minutes: 1
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.agent }}
          LIVE: ${{ needs.live.result }}
          PREPARE: ${{ needs.prepare.result }}
          AVAILABLE: ${{ needs.prepare.outputs.available }}
          AGENT: ${{ needs.agent-run.result }}
          VERIFY: ${{ needs.verify.result }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes: $CHANGES (the file filter must succeed, or the check would pass without running)"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            # push, schedule, a live-only manual run, or a PR without relevant changes
            echo "::notice::agent smoke not applicable to this run ($EVENT): live suite only or no relevant change"
            exit 0
          fi
          if [ "$PREPARE" = "skipped" ]; then
            # same conditions as the prepare job's `if`, to name the one that applied
            if [ "$ACTOR" = "dependabot[bot]" ]; then reason="Dependabot runs get no secrets"
            elif [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then reason="fork PR ($HEAD_REPO): no secrets"
            elif [ "$LIVE" != "success" ]; then
              echo "::error::live-tests-run: $LIVE - the agent smoke test runs only after the live suite passed"
              exit 1
            elif [ "$ACTOR" != "$OWNER" ] && [ "$ACTOR" != "github-actions[bot]" ]; then reason="actor $ACTOR is not the repository owner: the agent costs API credits, so it runs automatically only on the owner's changes (and the deps workflow's); start it by hand after review"
            else reason="prepare skipped by its conditions"; fi
            echo "::notice::agent smoke not run for this event: $reason"
            exit 0
          fi
          if [ "$PREPARE" != "success" ]; then echo "::error::agent-smoke-prepare: $PREPARE"; exit 1; fi
          if [ "$AVAILABLE" != "true" ]; then echo "::notice::skill not on the base branch yet: nothing to verify"; exit 0; fi
          if [ "$AGENT" != "success" ]; then echo "::error::agent-smoke-run: $AGENT"; exit 1; fi
          if [ "$VERIFY" != "success" ]; then echo "::error::agent-smoke-verify: $VERIFY"; exit 1; fi
          echo "agent smoke verified"

  # Removes what the agent run created and releases the test-account lock after the verdict, and also when the
  # workflow is cancelled or a job failed (always()). It does not decide the check. (The live suite cleans up in
  # its own job.)
  cleanup:
    name: agent-smoke-cleanup
    needs: [prepare, agent-run, verify]
    if: always() && needs.prepare.outputs.run_id != ''
    runs-on: ubuntu-latest
    environment: zotero-live
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: 24
      # First step that touches the account: the test group's name is read in-process (never printed), masked in every
      # later log line of the job and exported as ZOTERO_TEST_GROUP_NAME for the fail-closed checks of redact.mjs,
      # scrub-report.mjs and agent/summary.mjs (test/live/mask-group-name.mjs).
      - name: Mask the test group name
        timeout-minutes: 2
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
        run: node test/live/mask-group-name.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: agent-workspace
          path: ${{ runner.temp }}
      - name: Unpack the workspace
        timeout-minutes: 3
        run: tar -xzf "$RUNNER_TEMP/workspace.tgz"
      - name: Clean up the agent's run
        timeout-minutes: 5
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          ZOTERO_TEST_USER_ID: ${{ secrets.ZOTERO_TEST_USER_ID }}
          ZOTERO_TEST_USERNAME: ${{ secrets.ZOTERO_TEST_USERNAME }}
          ZOTERO_TEST_GROUP_ID: ${{ secrets.ZOTERO_TEST_GROUP_ID }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: npm run test:live:cleanup -- "$RUN_ID"
      - name: Release the test-account lock
        if: always()
        timeout-minutes: 3
        env:
          ZOTERO_TEST_API_KEY: ${{ secrets.ZOTERO_TEST_API_KEY }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: node test/live/lock.mjs release "$RUN_ID"

  # Scheduled-run failures of the live suite open (or update) one issue; it carries links and test names, never data.
  weekly-issue:
    name: live-tests-weekly-issue
    needs: live
    if: always() && github.event_name == 'schedule' && needs.live.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: live-report
          path: live-artifacts
      - name: Open or update the weekly issue
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(node -e '
            const fs = require("fs");
            const p = "live-artifacts/live-report.json";
            if (!fs.existsSync(p)) { console.log("- (report not available)"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            const names = r.testResults.flatMap((f) => f.assertionResults.filter((t) => t.status === "failed").map((t) => t.fullName || t.title));
            console.log(names.length ? names.map((n) => "- " + n).join("\n") : "- (failure outside the tests: setup, teardown or cleanup)");
          ')
          body=$(printf 'Run: %s\n\nFailed tests:\n%s\n' "$RUN_URL" "$failed")
          title="Test dal vivo settimanali falliti"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
